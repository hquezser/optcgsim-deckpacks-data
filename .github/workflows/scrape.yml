name: Scraping planifié

on:
  schedule:
    # Une fois par jour, 05:12 UTC. Heure décalée volontairement : les minutes rondes sont
    # les plus chargées chez GitHub, et un cron à l'heure pile est souvent retardé.
    - cron: "12 5 * * *"
  workflow_dispatch:
    inputs:
      forcer_notification:
        description: >
          Notifier le site même si le corpus n'a pas changé. Sert à ÉPROUVER le chemin de
          notification : sans cela il ne s'exécute qu'en cas de changement de corpus, donc
          jamais au moment où on cherche justement à le tester.
        type: boolean
        default: false

permissions:
  contents: write

# Jamais deux scrapings simultanés : ils écriraient dans le même `packs/`.
concurrency:
  group: scraping
  cancel-in-progress: false

jobs:
  scraper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: optcgsim-deckpacks-data

      # Le validateur du format vit dans le dépôt voisin, atteint par chemin relatif.
      - uses: actions/checkout@v4
        with:
          repository: hquezser/optcgsim-deckpacks
          path: optcgsim-deckpacks

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        working-directory: optcgsim-deckpacks-data
        # pytest est nécessaire à l'étape « Tests de la règle de fusion » et n'est PAS dans
        # requirements.txt (qui liste les dépendances d'exécution des scrapers). Sans lui,
        # le run échouait juste avant de commiter : le scraping et la validation
        # réussissaient, puis « No module named pytest » jetait tout le travail.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      # ChinoizeCupStats : coupes en ligne, quotidiennes. C'est la source qui bouge le plus,
      # et celle dont le pool est en avance sur le circuit papier.
      #
      # Fenêtre à 40 tournois et non 20 : depuis que le scraper saute ce qu'il a déjà
      # collecté (index par identifiant de tournoi), élargir ne coûte RIEN en requêtes et
      # rattrape les trous qu'aurait laissés une semaine de CI en panne. Le coût d'un
      # tournoi est payé une fois, pas tous les jours.
      #
      # Sans `--force`, l'écriture est une UNION par nom de deck : un run qui voit moins de
      # decks qu'un précédent (site incomplet, decklist en échec) ne peut pas détruire un
      # pack plus riche. C'est ce qui rend un scraping non surveillé acceptable — l'incident
      # inverse s'est produit à la main, un pack de 16 decks réduit à 5.
      - name: Scraper ChinoizeCupStats
        working-directory: optcgsim-deckpacks-data
        # `pipefail` explicite : sans lui, `python … | tee` renverrait le code de `tee`,
        # toujours 0, et une vraie panne du scraper passerait pour un succès.
        run: |
          set -o pipefail
          python scripts/scrape_chinoizecup.py --top 16 --delay 0.7 \
            --limit-tournaments 40 2>&1 | tee /tmp/chinoize.log

      # La collecte s'arrête d'elle-même quand la source répond en 429/5xx trois fois de
      # suite (cf. MAX_ECHECS_SERVEUR). Ce n'est PAS un échec — le corpus écrit est valide et
      # la fusion étant une union, le prochain passage rattrape — mais ça doit être visible :
      # si ça se répète, c'est que la source est durablement en difficulté, et c'est à nous
      # d'espacer ou de demander un accès dédié.
      - name: Signaler une source saturée
        if: always()
        run: |
          if grep -q 'SOURCE SATUREE' /tmp/chinoize.log 2>/dev/null; then
            echo "::warning title=Source saturée::chinoizecupstats.com a répondu en erreur serveur à répétition ; la collecte s'est interrompue d'elle-même."
            echo "### ⚠ Source saturée" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "La collecte ChinoizeCupStats s'est interrompue après des erreurs serveur répétées." >> "$GITHUB_STEP_SUMMARY"
            echo "Si ça se reproduit, espacer le cron ou demander un accès dédié." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Limitless : circuit papier. Tourne à CHAQUE run, planifié comme manuel.
      #
      # Il était gardé par `if: schedule || inputs.limitless` pour ne pas solliciter
      # Limitless à chaque dispatch. Effet réel : aucun run planifié n'ayant encore eu lieu,
      # le circuit papier n'a plus été collecté du tout pendant un mois, sans que rien ne le
      # signale — le corpus grossissait (côté en ligne), donc tout paraissait sain.
      #
      # Fenêtre à 3 mois et non 1 : sur 1 mois, un tournoi manqué pendant une semaine de
      # panne sort définitivement de portée. C'est ce qui a fait perdre Wolverhampton. La
      # fusion étant une union, re-scraper du déjà-vu ne coûte que des requêtes.
      - name: Scraper Limitless
        working-directory: optcgsim-deckpacks-data
        # Région par région : le listing global renvoyait moins de tournois que l'union des
        # régions, même après correction de la pagination.
        run: |
          for r in eu na la oc asia; do
            python scripts/scrape_limitless.py --region "$r" --time 3months --top 16 --delay 0.7 || true
          done

      # Rien n'est commité sans être valide. Un corpus cassé publié automatiquement serait
      # pire que pas de mise à jour du tout.
      - name: Valider tout le corpus
        working-directory: optcgsim-deckpacks-data
        run: python ../optcgsim-deckpacks/scripts/validate.py packs/*

      - name: Tests de la règle de fusion
        working-directory: optcgsim-deckpacks-data
        run: python -m pytest -q tests/

      - name: Commiter si le corpus a changé
        id: commit
        working-directory: optcgsim-deckpacks-data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- packs/; then
            echo "change=non" >> "$GITHUB_OUTPUT"
            echo "Corpus inchangé — rien à commiter."
            exit 0
          fi
          n_t=$(ls -d packs/*/ | wc -l | tr -d ' ')
          n_d=$(python -c 'import json,glob; print(sum(len(json.load(open(f))["decks"]) for f in glob.glob("packs/*/deckpack.json")))')
          git add packs/
          # Deux -m plutôt qu'une chaîne multiligne : dans un bloc `run: |`, une chaîne
          # multiligne hériterait de l'indentation YAML jusque dans le message de commit.
          git commit \
            -m "packs : scraping automatique ($n_t tournois, $n_d decklists)" \
            -m "Écriture par UNION : un run qui voit moins de decks ne peut pas appauvrir un pack existant. Corpus validé contre la spec, et tests de fusion verts, avant ce commit."
          git push
          echo "change=oui" >> "$GITHUB_OUTPUT"

      # Le site vit dans un autre dépôt : il faut le prévenir, sinon il resterait sur des
      # données périmées jusqu'au prochain changement de son propre code.
      # Redéploiement IMMÉDIAT du site — optionnel, et jamais bloquant.
      #
      # Le chemin nominal est ailleurs : le dépôt du site a son propre horaire (05:45 UTC)
      # et va chercher le corpus tout seul. Il n'a donc besoin d'aucun token, alors que ce
      # dispatch en exige un — le GITHUB_TOKEN d'une Action ne peut pas déclencher un
      # workflow dans un autre dépôt. Ce raccourci ne fait que gagner une demi-heure.
      #
      # `continue-on-error` : un problème de token ne doit pas faire échouer un scraping
      # par ailleurs réussi et déjà commité. C'est arrivé — un 403 marquait tout le run en
      # échec alors que 240 nouvelles decklists venaient d'être publiées correctement.
      - name: Redéployer le site tout de suite (optionnel)
        if: steps.commit.outputs.change == 'oui' || inputs.forcer_notification
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Pas de DISPATCH_TOKEN : le site se rafraîchira à son horaire (05:45 UTC)."
            exit 0
          fi
          if gh api repos/hquezser/optcgsim-deckpacks-library/dispatches \
               -f event_type=corpus-mis-a-jour; then
            echo "Redéploiement demandé."
          else
            echo "::warning::dispatch refusé (permissions du token) — le site se"
            echo "rafraîchira à son horaire. Le token doit couvrir le dépôt LIBRARY"
            echo "(pas data) avec « Contents: Read and write »."
          fi
